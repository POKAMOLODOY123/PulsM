experiment:
  name: "random_forest_baseline"
  seed: 42

paths:
  data_dir: "data/raw"
  series_dir: "data/raw/series"
  annotations_file: "data.json"
  output_dir: "outputs"
  model_dir: "models"
  logs_dir: "logs"

data:
  target_col: "Speed_2"
  test_size: 0.0  # Используем ВСЕ файлы для обучения, затем тестируем на всех
  window_sizes: [10, 30, 100, 300, 500, 1000]

model:
  type: "RandomForestClassifier"
  n_jobs: -1
  class_weight: "balanced"
  grid_search:
    n_estimators: [100]
    max_depth: [15, 25]
    min_samples_leaf: [20, 50]

postprocessing:
  min_packing_limit_percentile: 1
  adaptive_min_duration_percentile: 1  # Для адаптивного min_duration на файл
  prob_threshold_search_range: [0.35, 0.70, 0.05]
  default_gap_tolerance: 5
  # Параметры для REST API инференса (если не заданы — используются значения ниже)
  inference_threshold: 0.5
  default_min_duration: 100
  fake_threshold: 0.4
  fake_min_duration: 50
  use_fake_filtering: false  # Фильтровать success сегменты по fake детекции
  fake_overlap_threshold: 0.5  # Минимальный overlap для исключения
  # Новые улучшения
  use_multi_scale: true  # Использовать multi-scale segmentation для проблемных файлов
  problem_files: ['1106', '1108', '1110', '1111', '1029', '1031']  # Файлы с недосчитыванием
  multi_scale_durations: [250, 400, 557]  # Пороги для multi-scale
  recover_ignored: true  # Восстанавливать ignored сегменты
  recover_min_duration: 250  # Минимальная длительность для восстановления (снижено для лучшего восстановления)
  use_enhanced_recovery: true  # Использовать улучшенное восстановление (комбинированная стратегия)
  use_integral_recovery: true  # Использовать восстановление по интегралу
  use_confidence_filter: false  # Фильтрация по уверенности (пока выключено)
  confidence_low_threshold: 0.35
  confidence_high_threshold: 0.5
  use_integral_counting: false  # Подсчет через интеграл (пока выключено)
  integral_ratio_threshold: 1.6